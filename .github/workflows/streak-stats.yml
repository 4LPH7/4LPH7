name: Update streak stats

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0D1117&ring=00F7FF&fire=7C3AED&currStreakLabel=00F7FF&sideLabels=C9D1D9&dates=C9D1D9&timezone=Asia/Kolkata&disable_animations=false
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || github.token }}

      - name: Refresh README image version
        shell: bash
        env:
          VERSION: ${{ hashFiles('profile/streak.svg') }}
        run: |
          perl -pi -e 's#src="./profile/streak\.svg(?:\?v=[^"]*)?"#src="./profile/streak.svg?v=$ENV{VERSION}"#' README.md

      - name: Commit refreshed streak
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh streak stats"
          git push
